<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aqua Resonance HUD — Hand Tracking Water Surface</title>

  <!-- MediaPipe Hands -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

  <!-- Fonts: Orbitron(HUDラベル) / Noto Sans JP(本文) / JetBrains Mono(数値) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-deep: #020812;
      --glass-cyan: #7deaff;
      --glass-violet: #c9a6ff;
      --ink: #eaf6ff;
      --ink-dim: rgba(234, 246, 255, 0.56);
      --accent-gold: #ffd9a0;
      --danger: #ff90a3;
      --panel-bg: linear-gradient(160deg, rgba(14, 30, 46, 0.5), rgba(6, 14, 26, 0.62));
      --panel-border: rgba(125, 234, 255, 0.28);
      --font-display: "Orbitron", "Noto Sans JP", sans-serif;
      --font-body: "Noto Sans JP", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", ui-monospace, monospace;
    }

    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: var(--bg-deep);
      font-family: var(--font-body);
      touch-action: none;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      cursor: crosshair;
    }

    video {
      position: fixed;
      left: 0;
      top: 0;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    /* 画面四隅のHUDブラケット（装飾・操作の邪魔をしない） */
    .hud-corner {
      position: fixed;
      width: 34px;
      height: 34px;
      z-index: 5;
      pointer-events: none;
      opacity: 0.55;
    }
    .hud-corner svg { width: 100%; height: 100%; display: block; }
    .hud-corner.tl { top: 14px; left: 14px; }
    .hud-corner.tr { top: 14px; right: 14px; transform: scaleX(-1); }
    .hud-corner.bl { bottom: 14px; left: 14px; transform: scaleY(-1); }
    .hud-corner.br { bottom: 14px; right: 14px; transform: scale(-1, -1); }

    #ui {
      position: fixed;
      left: 16px;
      top: 16px;
      z-index: 10;
      width: 252px;
      color: var(--ink);
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      backdrop-filter: blur(18px) saturate(140%);
      -webkit-backdrop-filter: blur(18px) saturate(140%);
      padding: 16px 16px 14px;
      border-radius: 18px;
      font-size: 13px;
      line-height: 1.6;
      user-select: none;
      box-shadow:
        0 0 0 1px rgba(125, 234, 255, 0.06) inset,
        0 18px 40px rgba(0, 0, 0, 0.45),
        0 0 26px rgba(125, 234, 255, 0.06);
    }

    .hud-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 12.5px;
      letter-spacing: 0.14em;
      color: var(--glass-cyan);
      text-shadow: 0 0 14px rgba(125, 234, 255, 0.55);
      margin-bottom: 10px;
    }
    .hud-title .dot-pulse {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--glass-cyan);
      box-shadow: 0 0 8px var(--glass-cyan), 0 0 2px #fff;
      animation: pulse 1.8s ease-in-out infinite;
      flex: none;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.15); }
    }

    .hud-divider {
      height: 1px;
      margin: 10px 0;
      background: linear-gradient(90deg, rgba(125,234,255,0.5), rgba(201,166,255,0.15), transparent);
    }

    button {
      appearance: none;
      -webkit-appearance: none;
      font-family: var(--font-body);
      border: 1px solid rgba(125, 234, 255, 0.4);
      background: linear-gradient(160deg, rgba(125,234,255,0.16), rgba(201,166,255,0.08));
      color: var(--ink);
      padding: 9px 14px;
      border-radius: 999px;
      cursor: pointer;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.02em;
      transition: background 0.2s ease, box-shadow 0.2s ease, transform 0.15s ease;
      width: 100%;
    }

    button:hover {
      background: linear-gradient(160deg, rgba(125,234,255,0.28), rgba(201,166,255,0.16));
      box-shadow: 0 0 16px rgba(125, 234, 255, 0.28);
    }
    button:active { transform: scale(0.98); }
    button:disabled {
      opacity: 0.55;
      cursor: default;
      box-shadow: none;
    }

    .hud-help {
      font-size: 11.5px;
      color: var(--ink-dim);
      line-height: 1.7;
    }
    .hud-help b { color: var(--ink); font-weight: 500; }

    #toggleControlsBtn {
      margin-top: 10px;
      margin-bottom: 2px;
      padding: 6px 10px;
      font-size: 11.5px;
      background: rgba(255,255,255,0.05);
      border-color: rgba(255,255,255,0.18);
    }
    #toggleControlsBtn:hover { background: rgba(255,255,255,0.1); }

    #controlsPanel {
      margin-top: 6px;
    }

    #controlsPanel.hidden {
      display: none;
    }

    .control {
      margin-top: 10px;
      display: grid;
      grid-template-columns: 52px 1fr 34px;
      gap: 8px;
      align-items: center;
      font-size: 11.5px;
      color: var(--ink-dim);
    }

    /* HUD風フェーダー */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--glass-cyan) 0%, var(--glass-cyan) var(--fill, 50%), rgba(255,255,255,0.14) var(--fill, 50%), rgba(255,255,255,0.14) 100%);
      outline: none;
      cursor: pointer;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--glass-cyan);
      box-shadow: 0 0 8px rgba(125, 234, 255, 0.7);
      cursor: pointer;
      margin-top: 0;
    }
    input[type="range"]::-moz-range-track {
      height: 4px;
      border-radius: 999px;
      background: rgba(255,255,255,0.14);
    }
    input[type="range"]::-moz-range-progress {
      height: 4px;
      border-radius: 999px;
      background: var(--glass-cyan);
    }
    input[type="range"]::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--glass-cyan);
      box-shadow: 0 0 8px rgba(125, 234, 255, 0.7);
      cursor: pointer;
    }

    .value {
      text-align: right;
      opacity: 0.9;
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      color: var(--accent-gold);
    }

    #statusBlock {
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--ink-dim);
    }

    .status-row .led {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex: none;
      background: #667;
      box-shadow: 0 0 0 rgba(0,0,0,0);
      transition: background 0.25s ease, box-shadow 0.25s ease;
    }
    .status-row .led.on {
      background: #7dffb0;
      box-shadow: 0 0 8px #7dffb0;
    }
    .status-row .led.warn {
      background: var(--danger);
      box-shadow: 0 0 8px var(--danger);
    }
    .status-row .led.active {
      background: var(--glass-violet);
      box-shadow: 0 0 10px var(--glass-violet);
    }

    /* ピンチ強度の円形ゲージ */
    #pinchGaugeWrap {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 4px;
    }
    #pinchGaugeWrap svg { flex: none; }
    #pinchGaugeWrap .gauge-track {
      fill: none;
      stroke: rgba(255,255,255,0.12);
      stroke-width: 4;
    }
    #pinchGaugeWrap .gauge-fill {
      fill: none;
      stroke: var(--glass-violet);
      stroke-width: 4;
      stroke-linecap: round;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
      filter: drop-shadow(0 0 4px rgba(201,166,255,0.8));
      transition: stroke-dashoffset 0.12s ease-out;
    }
    #pinchGaugeLabel {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--ink-dim);
      line-height: 1.5;
    }
    #pinchGaugeLabel .big {
      font-size: 15px;
      color: var(--glass-violet);
      font-weight: 600;
    }
  </style>
</head>
<body>
  <!-- 画面四隅のHUDフレーム -->
  <div class="hud-corner tl"><svg viewBox="0 0 34 34"><path d="M2 22 L2 2 L22 2" fill="none" stroke="#7deaff" stroke-width="2"/></svg></div>
  <div class="hud-corner tr"><svg viewBox="0 0 34 34"><path d="M2 22 L2 2 L22 2" fill="none" stroke="#7deaff" stroke-width="2"/></svg></div>
  <div class="hud-corner bl"><svg viewBox="0 0 34 34"><path d="M2 22 L2 2 L22 2" fill="none" stroke="#7deaff" stroke-width="2"/></svg></div>
  <div class="hud-corner br"><svg viewBox="0 0 34 34"><path d="M2 22 L2 2 L22 2" fill="none" stroke="#7deaff" stroke-width="2"/></svg></div>
  <canvas id="water"></canvas>
  <video id="video" playsinline></video>

  <div id="ui">
    <div class="hud-title"><span class="dot-pulse"></span>AQUA RESONANCE HUD</div>

    <button id="startBtn">Start Camera / Audio</button>

    <div class="hud-help">
      <b>クリック</b>：水滴を落とす<br>
      <b>ピンチ</b>：溜めてから落下 → 強い波紋<br>
      MediaPipe Hands・21点ランドマークで検出<br>
      波の干渉で色と音が変化します
    </div>

    <div class="hud-divider"></div>

    <button id="toggleControlsBtn">スライダー非表示</button>

    <div id="controlsPanel">
      <div class="control">
        <label for="blurSlider">ぼかし</label>
        <input id="blurSlider" type="range" min="0" max="40" value="18" step="1">
        <span id="blurValue" class="value">18</span>
      </div>

      <div class="control">
        <label for="brightnessSlider">明るさ</label>
        <input id="brightnessSlider" type="range" min="20" max="120" value="52" step="1">
        <span id="brightnessValue" class="value">52</span>
      </div>

      <div class="control">
        <label for="saturateSlider">彩度</label>
        <input id="saturateSlider" type="range" min="0" max="250" value="125" step="1">
        <span id="saturateValue" class="value">125</span>
      </div>

      <div class="control">
        <label for="veilSlider">水面</label>
        <input id="veilSlider" type="range" min="0" max="85" value="48" step="1">
        <span id="veilValue" class="value">48</span>
      </div>
    </div>

    <div class="hud-divider"></div>

    <div id="statusBlock">
      <div class="status-row"><span id="statusLed" class="led"></span><span id="status">camera: waiting</span></div>

      <div id="pinchGaugeWrap">
        <svg width="40" height="40" viewBox="0 0 40 40">
          <circle class="gauge-track" cx="20" cy="20" r="16"></circle>
          <circle id="pinchGaugeFill" class="gauge-fill" cx="20" cy="20" r="16"
                  stroke-dasharray="100.53" stroke-dashoffset="100.53"></circle>
        </svg>
        <div id="pinchGaugeLabel">pinch<br><span id="pinchGaugeText" class="big">--</span></div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("water");
    const ctx = canvas.getContext("2d");

    const video = document.getElementById("video");
    const startBtn = document.getElementById("startBtn");
    const statusEl = document.getElementById("status");
    const statusLedEl = document.getElementById("statusLed");
    const pinchGaugeFillEl = document.getElementById("pinchGaugeFill");
    const pinchGaugeTextEl = document.getElementById("pinchGaugeText");
    const toggleControlsBtn = document.getElementById("toggleControlsBtn");
    const controlsPanel = document.getElementById("controlsPanel");
    const GAUGE_CIRC = 100.53; // 2 * PI * r(16)

    const blurSlider = document.getElementById("blurSlider");
    const brightnessSlider = document.getElementById("brightnessSlider");
    const saturateSlider = document.getElementById("saturateSlider");
    const veilSlider = document.getElementById("veilSlider");

    const blurValue = document.getElementById("blurValue");
    const brightnessValue = document.getElementById("brightnessValue");
    const saturateValue = document.getElementById("saturateValue");
    const veilValue = document.getElementById("veilValue");

    const cameraFx = {
      blur: 18,
      brightness: 52,
      saturate: 125,
      veil: 48
    };

    function updateSliderFill(slider) {
      const min = Number(slider.min);
      const max = Number(slider.max);
      const pct = ((Number(slider.value) - min) / (max - min)) * 100;
      slider.style.setProperty("--fill", pct + "%");
    }

    function bindSlider(slider, output, key) {
      updateSliderFill(slider);
      slider.addEventListener("input", () => {
        cameraFx[key] = Number(slider.value);
        output.textContent = slider.value;
        updateSliderFill(slider);
      });
    }

    bindSlider(blurSlider, blurValue, "blur");
    bindSlider(brightnessSlider, brightnessValue, "brightness");
    bindSlider(saturateSlider, saturateValue, "saturate");
    bindSlider(veilSlider, veilValue, "veil");

    // ピンチ強度ゲージの更新
    function setPinchGauge(strength, active) {
      const clamped = Math.max(0, Math.min(1, strength));
      pinchGaugeFillEl.style.strokeDashoffset = GAUGE_CIRC * (1 - clamped);
      pinchGaugeTextEl.textContent = Math.round(clamped * 100) + "%";
      pinchGaugeFillEl.style.stroke = active ? "var(--glass-violet)" : "var(--glass-cyan)";
    }

    toggleControlsBtn.addEventListener("click", () => {
      controlsPanel.classList.toggle("hidden");
      toggleControlsBtn.textContent = controlsPanel.classList.contains("hidden")
        ? "スライダー表示"
        : "スライダー非表示";
    });

    let W = 0;
    let H = 0;
    let dpr = window.devicePixelRatio || 1;

    // 波紋の持続時間。短くしたい場合はさらに小さくする
    const RIPPLE_LIFETIME = 4.8;

    const ripples = [];
    const fingerState = new Map();
    const interferenceSounds = [];
    const fallingDrops = [];

    // ピンチしてから水面に落ちるまでの時間。大きくするとタイムラグが長くなる
    const PINCH_DROP_FALL_TIME = 1050;

    let audioCtx = null;
    let started = false;
    let lastInterferenceSoundAt = 0;
    let reverbNode = null;      // 幻想的な残響を作るコンボルバー
    let reverbWetGain = null;
    let padStarted = false;

    // 残響用のインパルスレスポンスをノイズから生成（外部音源ファイル不要）
    function createImpulseResponse(duration = 3.6, decay = 3.2) {
      const rate = audioCtx.sampleRate;
      const length = Math.floor(rate * duration);
      const impulse = audioCtx.createBuffer(2, length, rate);

      for (let ch = 0; ch < 2; ch++) {
        const data = impulse.getChannelData(ch);
        for (let i = 0; i < length; i++) {
          data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
        }
      }

      return impulse;
    }

    // 常に鳴り続けるアンビエントパッド。水面の"間"を幻想的に満たす
    function startAmbientPad() {
      if (padStarted) return;
      padStarted = true;

      const notes = [130.81, 164.81, 196.0, 246.94]; // C3-E3-G3-B3（幻想的な浮遊コード）

      const padBus = audioCtx.createGain();
      padBus.gain.value = 0.0001;
      padBus.connect(audioCtx.destination);
      padBus.connect(reverbNode);
      padBus.gain.exponentialRampToValueAtTime(0.05, audioCtx.currentTime + 5);

      notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        osc.type = "sine";
        osc.frequency.value = freq;
        osc.detune.value = i % 2 === 0 ? -6 : 6;

        const oscGain = audioCtx.createGain();
        oscGain.gain.value = 0.55;

        const filter = audioCtx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.value = 800;
        filter.Q.value = 0.4;

        // ゆっくりとしたLFOでフィルターを揺らし、きらめくような質感にする
        const lfo = audioCtx.createOscillator();
        lfo.frequency.value = 0.04 + i * 0.015;
        const lfoGain = audioCtx.createGain();
        lfoGain.gain.value = 200;
        lfo.connect(lfoGain);
        lfoGain.connect(filter.frequency);
        lfo.start();

        // 左右にゆっくり回るパン
        const panner = audioCtx.createStereoPanner();
        const panLfo = audioCtx.createOscillator();
        panLfo.frequency.value = 0.03 + i * 0.01;
        const panLfoGain = audioCtx.createGain();
        panLfoGain.gain.value = 0.7;
        panLfo.connect(panLfoGain);
        panLfoGain.connect(panner.pan);
        panLfo.start();

        osc.connect(filter);
        filter.connect(oscGain);
        oscGain.connect(panner);
        panner.connect(padBus);
        osc.start();
      });
    }

    function resize() {
      dpr = window.devicePixelRatio || 1;
      W = window.innerWidth;
      H = window.innerHeight;

      canvas.width = Math.floor(W * dpr);
      canvas.height = Math.floor(H * dpr);
      canvas.style.width = W + "px";
      canvas.style.height = H + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    window.addEventListener("resize", resize);
    resize();

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        reverbNode = audioCtx.createConvolver();
        reverbNode.buffer = createImpulseResponse();

        reverbWetGain = audioCtx.createGain();
        reverbWetGain.gain.value = 0.5;

        reverbNode.connect(reverbWetGain);
        reverbWetGain.connect(audioCtx.destination);

        startAmbientPad();
      }

      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
    }

    // 現在の水面の干渉量を計算
    function fieldAt(x, y) {
      const now = performance.now();
      let sum = 0;

      for (const r of ripples) {
        const age = (now - r.t) / 1000;
        if (age < 0 || age > RIPPLE_LIFETIME) continue;

        const dx = x - r.x;
        const dy = y - r.y;
        const dist = Math.sqrt(dx * dx + dy * dy);

        const wave = Math.sin(dist * 0.055 - age * 9.0);
        const decay = Math.exp(-age * 1.15) * Math.exp(-dist * 0.006);

        sum += wave * decay * r.power;
      }

      return sum;
    }

    function playDropSound(x, y, interference) {
      if (!audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();

      const baseFreq = 180 + (1 - y / H) * 560;
      const interferenceShift = Math.abs(interference) * 180;

      osc.type = "sine";
      osc.frequency.setValueAtTime(baseFreq + interferenceShift, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(
        Math.max(80, baseFreq * 0.55),
        audioCtx.currentTime + 0.3
      );

      filter.type = "lowpass";
      filter.frequency.setValueAtTime(
        900 + Math.abs(interference) * 1200,
        audioCtx.currentTime
      );

      gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.11, audioCtx.currentTime + 0.012);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.34);

      // 倍音を少し外した副オシレーターを重ね、クリスタルのような煌めきを加える
      const shimmer = audioCtx.createOscillator();
      const shimmerGain = audioCtx.createGain();
      shimmer.type = "sine";
      shimmer.frequency.setValueAtTime((baseFreq + interferenceShift) * 2.76, audioCtx.currentTime);
      shimmer.frequency.exponentialRampToValueAtTime(
        Math.max(160, baseFreq * 1.4),
        audioCtx.currentTime + 0.3
      );
      shimmerGain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      shimmerGain.gain.exponentialRampToValueAtTime(0.035, audioCtx.currentTime + 0.012);
      shimmerGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.5);
      shimmer.connect(shimmerGain);
      shimmerGain.connect(audioCtx.destination);
      shimmerGain.connect(reverbNode);
      shimmer.start();
      shimmer.stop(audioCtx.currentTime + 0.52);

      osc.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      gain.connect(reverbNode);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.36);
    }

    function playStrongDropSound(x, y) {
      if (!audioCtx) return;

      const osc1 = audioCtx.createOscillator();
      const osc2 = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();

      const baseFreq = 90 + (1 - y / H) * 180;

      osc1.type = "sine";
      osc2.type = "triangle";

      osc1.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
      osc2.frequency.setValueAtTime(baseFreq * 1.5, audioCtx.currentTime);

      osc1.frequency.exponentialRampToValueAtTime(
        Math.max(45, baseFreq * 0.45),
        audioCtx.currentTime + 0.58
      );

      osc2.frequency.exponentialRampToValueAtTime(
        Math.max(60, baseFreq * 0.6),
        audioCtx.currentTime + 0.38
      );

      filter.type = "lowpass";
      filter.frequency.setValueAtTime(1200, audioCtx.currentTime);
      filter.frequency.exponentialRampToValueAtTime(260, audioCtx.currentTime + 0.62);

      gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.26, audioCtx.currentTime + 0.018);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.68);

      // 幻想的な余韻を作るベル状の高次倍音レイヤー
      const bell = audioCtx.createOscillator();
      const bellGain = audioCtx.createGain();
      bell.type = "sine";
      bell.frequency.setValueAtTime(baseFreq * 4.2, audioCtx.currentTime);
      bell.frequency.exponentialRampToValueAtTime(baseFreq * 2.1, audioCtx.currentTime + 1.1);
      bellGain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      bellGain.gain.exponentialRampToValueAtTime(0.05, audioCtx.currentTime + 0.02);
      bellGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.3);
      bell.connect(bellGain);
      bellGain.connect(reverbNode);
      bellGain.connect(audioCtx.destination);
      bell.start();
      bell.stop(audioCtx.currentTime + 1.35);

      osc1.connect(filter);
      osc2.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      gain.connect(reverbNode);

      osc1.start();
      osc2.start();

      osc1.stop(audioCtx.currentTime + 0.72);
      osc2.stop(audioCtx.currentTime + 0.72);
    }

    // 波の干渉が強い時に鳴る短い倍音
    function playInterferenceSound(x, y, strength) {
      if (!audioCtx) return;

      const oscA = audioCtx.createOscillator();
      const oscB = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const panner = audioCtx.createStereoPanner();

      const normX = Math.max(-1, Math.min(1, (x / W) * 2 - 1));
      const freq = 280 + (1 - y / H) * 700 + Math.min(260, strength * 90);

      oscA.type = "sine";
      oscB.type = "sine";

      oscA.frequency.setValueAtTime(freq, audioCtx.currentTime);
      oscB.frequency.setValueAtTime(freq * 1.505, audioCtx.currentTime);

      // 少しだけ揺らして、水面の干渉らしい濁りを出す
      oscA.detune.setValueAtTime(-7 + strength * 3, audioCtx.currentTime);
      oscB.detune.setValueAtTime(9 - strength * 2, audioCtx.currentTime);

      panner.pan.setValueAtTime(normX, audioCtx.currentTime);

      const vol = Math.min(0.13, 0.035 + strength * 0.018);
      gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(vol, audioCtx.currentTime + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.28);

      oscA.connect(gain);
      oscB.connect(gain);
      gain.connect(panner);
      panner.connect(audioCtx.destination);
      panner.connect(reverbNode);

      oscA.start();
      oscB.start();

      oscA.stop(audioCtx.currentTime + 0.32);
      oscB.stop(audioCtx.currentTime + 0.32);

      interferenceSounds.push({
        x,
        y,
        t: performance.now(),
        strength
      });
    }

    function addFallingDrop(x, y, power = 3.2) {
      // ピンチ位置から少し上に水滴を発生させ、時間差で水面へ落とす
      const startY = Math.max(0, y - 90);
      const endY = y;

      fallingDrops.push({
        x,
        startY,
        endY,
        y: startY,
        t: performance.now(),
        duration: PINCH_DROP_FALL_TIME,
        power,
        hit: false
      });
    }

    function updateFallingDrops() {
      const now = performance.now();

      for (let i = fallingDrops.length - 1; i >= 0; i--) {
        const d = fallingDrops[i];
        const p = Math.min(1, (now - d.t) / d.duration);

        // ease-in：最初はゆっくり、最後に少し速く落ちる
        const eased = p * p;
        d.y = d.startY + (d.endY - d.startY) * eased;

        if (p >= 1 && !d.hit) {
          d.hit = true;
          addRipple(d.x, d.endY, d.power, "pinch");
          fallingDrops.splice(i, 1);
        }
      }
    }

    function drawFallingDrops() {
      const now = performance.now();

      for (const d of fallingDrops) {
        const p = Math.min(1, (now - d.t) / d.duration);
        const alpha = 0.95 - p * 0.2;
        const r = 5 + p * 3;

        // 落下の軌跡
        const trail = ctx.createLinearGradient(d.x, d.startY, d.x, d.y);
        trail.addColorStop(0, "rgba(235,210,255,0)");
        trail.addColorStop(0.72, `rgba(235,210,255,${0.12 + p * 0.12})`);
        trail.addColorStop(1, `rgba(255,245,255,${0.28 + p * 0.22})`);

        ctx.strokeStyle = trail;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(d.x, d.startY);
        ctx.lineTo(d.x, d.y);
        ctx.stroke();

        // 水滴本体
        const glow = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, 28 + p * 18);
        glow.addColorStop(0, `rgba(255,245,255,${0.52 * alpha})`);
        glow.addColorStop(0.25, `rgba(220,175,255,${0.32 * alpha})`);
        glow.addColorStop(1, "rgba(220,175,255,0)");

        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(d.x, d.y, 28 + p * 18, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = `rgba(255,248,255,${0.85 * alpha})`;
        ctx.beginPath();
        ctx.ellipse(d.x, d.y, r * 0.82, r * 1.18, 0, 0, Math.PI * 2);
        ctx.fill();

        // 着水直前の予兆リング
        if (p > 0.72) {
          const q = (p - 0.72) / 0.28;
          ctx.strokeStyle = `rgba(230,190,255,${0.42 * q})`;
          ctx.lineWidth = 1.4;
          ctx.beginPath();
          ctx.arc(d.x, d.endY, 10 + q * 24, 0, Math.PI * 2);
          ctx.stroke();
        }
      }
    }

    function addRipple(x, y, power = 1, source = "click") {
      const interference = fieldAt(x, y);

      let hue;
      const jitter = (Math.random() - 0.5) * 90; // 波紋ごとに色相をランダムにずらしてバリエーションを増やす

      if (source === "pinch") {
        hue = 275 + interference * 45 + jitter; // ピンチは紫〜マゼンタ〜ピンクの帯でランダムに変化
      } else {
        hue = 195 + interference * 70 + jitter; // クリックは水色〜青緑〜青紫の帯でランダムに変化
      }

      ripples.push({
        x,
        y,
        t: performance.now(),
        power,
        hue,
        source
      });

      while (ripples.length > 44) {
        ripples.shift();
      }

      if (source === "pinch") {
        playStrongDropSound(x, y);
      } else {
        playDropSound(x, y, interference);
      }
    }

    canvas.addEventListener("pointerdown", (e) => {
      initAudio();
      addRipple(e.clientX, e.clientY, 1.4, "click");
    });

    // ドラッグ・なぞりによる波紋は削除。
    // クリック、またはピンチだけで水滴が発生する。

    function drawWaterBase() {
      // カメラ映像をCanvasに直接描画する。
      // CSSでvideoを背景表示するより安定しやすい。
      if (video.readyState >= 2 && video.videoWidth > 0 && video.videoHeight > 0) {
        ctx.save();

        // 背景として左右反転して描画
        ctx.translate(W, 0);
        ctx.scale(-1, 1);

        // 画面全体をcoverするようにトリミング
        const vw = video.videoWidth;
        const vh = video.videoHeight;
        const videoRatio = vw / vh;
        const screenRatio = W / H;

        let sx = 0;
        let sy = 0;
        let sw = vw;
        let sh = vh;

        if (videoRatio > screenRatio) {
          // 横長すぎる場合は左右を切る
          sw = vh * screenRatio;
          sx = (vw - sw) * 0.5;
        } else {
          // 縦長すぎる場合は上下を切る
          sh = vw / screenRatio;
          sy = (vh - sh) * 0.5;
        }

        ctx.filter = `blur(${cameraFx.blur}px) brightness(${cameraFx.brightness / 100}) saturate(${cameraFx.saturate / 100})`;
        ctx.drawImage(video, sx, sy, sw, sh, 0, 0, W, H);
        ctx.filter = "none";
        ctx.restore();

        // カメラの上に暗い水面ベール
        ctx.fillStyle = `rgba(0, 12, 28, ${cameraFx.veil / 100})`;
        ctx.fillRect(0, 0, W, H);
      } else {
        // カメラ開始前の背景
        const grd = ctx.createRadialGradient(
          W * 0.5, H * 0.42, 20,
          W * 0.5, H * 0.5, Math.max(W, H)
        );

        grd.addColorStop(0, "#07304d");
        grd.addColorStop(0.42, "#041a2e");
        grd.addColorStop(1, "#010712");

        ctx.fillStyle = grd;
        ctx.fillRect(0, 0, W, H);
      }

      // 水面の青いグラデーション
      const grd2 = ctx.createRadialGradient(
        W * 0.5, H * 0.42, 20,
        W * 0.5, H * 0.5, Math.max(W, H)
      );

      grd2.addColorStop(0, "rgba(7, 48, 77, 0.42)");
      grd2.addColorStop(0.42, "rgba(4, 26, 46, 0.45)");
      grd2.addColorStop(1, "rgba(1, 7, 18, 0.58)");

      ctx.fillStyle = grd2;
      ctx.fillRect(0, 0, W, H);

      // 水面の薄い光
      ctx.fillStyle = "rgba(255,255,255,0.018)";
      for (let i = 0; i < 18; i++) {
        const y = (i / 18) * H;
        ctx.fillRect(0, y, W, 1);
      }
    }

    function drawInterferenceField() {
      const step = 8;
      const now = performance.now();

      for (let y = 0; y < H; y += step) {
        for (let x = 0; x < W; x += step) {
          let sum = 0;
          let energy = 0;

          for (const r of ripples) {
            const age = (now - r.t) / 1000;
            if (age > RIPPLE_LIFETIME) continue;

            const dx = x - r.x;
            const dy = y - r.y;
            const dist = Math.sqrt(dx * dx + dy * dy);

            const wave = Math.sin(dist * 0.047 - age * 7.8);
            const decay = Math.exp(-age * 0.9) * Math.exp(-dist * 0.0048);
            const v = wave * decay * r.power;

            sum += v;
            energy += Math.abs(v);
          }

          if (energy > 0.012) {
            const hue = 190 + sum * 105 + energy * 70;
            const light = 38 + Math.min(32, energy * 90);
            const alpha = Math.min(0.38, energy * 0.56);

            ctx.fillStyle = `hsla(${hue}, 88%, ${light}%, ${alpha})`;
            ctx.fillRect(x, y, step + 1, step + 1);
          }
        }
      }
    }

    // 波の干渉が強い地点を探して音を鳴らす
    function detectInterferenceSound() {
      if (!audioCtx || ripples.length < 2) return;

      const now = performance.now();

      // 鳴りすぎ防止（短くするほど頻繁に鳴る）
      if (now - lastInterferenceSoundAt < 130) return;

      let best = null;

      // 波紋同士の間を複数点サンプリングし、干渉が強い瞬間を逃しにくくする
      const sampleTs = [0.35, 0.5, 0.65];

      for (let i = 0; i < ripples.length; i++) {
        for (let j = i + 1; j < ripples.length; j++) {
          const a = ripples[i];
          const b = ripples[j];

          const ageA = (now - a.t) / 1000;
          const ageB = (now - b.t) / 1000;

          if (ageA > RIPPLE_LIFETIME || ageB > RIPPLE_LIFETIME) continue;

          for (const t of sampleTs) {
            const x = a.x + (b.x - a.x) * t;
            const y = a.y + (b.y - a.y) * t;

            const value = Math.abs(fieldAt(x, y));

            if (!best || value > best.value) {
              best = { x, y, value };
            }
          }
        }
      }

      // この数値を下げると干渉音が出やすくなる
      if (best && best.value > 0.55) {
        playInterferenceSound(best.x, best.y, best.value);
        lastInterferenceSoundAt = now;
      }
    }

    function drawRipples() {
      const now = performance.now();

      for (const r of ripples) {
        const age = (now - r.t) / 1000;
        if (age > RIPPLE_LIFETIME) continue;

        const isPinch = r.source === "pinch";
        const radiusSpeed = isPinch ? 150 : 115;
        const radius = age * radiusSpeed;
        const alpha = Math.max(0, 1 - age / RIPPLE_LIFETIME);

        const ringCount = isPinch ? 7 : 4;

        for (let i = 0; i < ringCount; i++) {
          const rr = radius - i * (isPinch ? 22 : 18);
          if (rr <= 0) continue;

          ctx.beginPath();
          ctx.arc(r.x, r.y, rr, 0, Math.PI * 2);

          const lineAlpha = isPinch
            ? alpha * (0.34 - i * 0.035)
            : alpha * (0.22 - i * 0.035);

          ctx.strokeStyle = `hsla(${r.hue + i * 18}, 95%, 72%, ${Math.max(0, lineAlpha)})`;
          ctx.lineWidth = isPinch ? 3.6 : 1.4 + r.power * 0.8;
          ctx.stroke();
        }

        // 中心の水滴光
        ctx.beginPath();
        ctx.arc(
          r.x,
          r.y,
          isPinch ? 7 + Math.sin(age * 16) * 2.5 : 3 + Math.sin(age * 16) * 1.5,
          0,
          Math.PI * 2
        );

        ctx.fillStyle = isPinch
          ? `hsla(${r.hue}, 100%, 82%, ${alpha * 0.8})`
          : `hsla(${r.hue}, 100%, 80%, ${alpha * 0.55})`;

        ctx.fill();

        // ピンチの余韻
        if (isPinch) {
          const glow = ctx.createRadialGradient(r.x, r.y, 0, r.x, r.y, 90 + age * 40);
          glow.addColorStop(0, `hsla(${r.hue}, 95%, 72%, ${alpha * 0.20})`);
          glow.addColorStop(1, `hsla(${r.hue}, 95%, 72%, 0)`);

          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(r.x, r.y, 90 + age * 40, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function drawInterferenceSoundMarks() {
      const now = performance.now();

      for (let i = interferenceSounds.length - 1; i >= 0; i--) {
        const s = interferenceSounds[i];
        const age = (now - s.t) / 1000;

        if (age > 0.6) {
          interferenceSounds.splice(i, 1);
          continue;
        }

        const alpha = 1 - age / 0.6;
        const radius = 18 + age * 85;

        ctx.beginPath();
        ctx.arc(s.x, s.y, radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255,255,210,${alpha * 0.42})`;
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(s.x, s.y, 3 + s.strength * 2, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,220,${alpha * 0.75})`;
        ctx.fill();
      }
    }

    function drawFingerTouches() {
      const now = performance.now();

      for (const [, f] of fingerState) {
        if (now - f.lastSeen > 250) continue;

        const isPinching = f.wasPinching;

        // 指先は水面に触れている位置のガイドとしてだけ表示。
        // 指をなぞっても波紋は発生しない。
        ctx.beginPath();
        ctx.arc(f.x, f.y, isPinching ? 24 : 12, 0, Math.PI * 2);
        ctx.strokeStyle = isPinching
          ? "rgba(230,180,255,0.75)"
          : "rgba(255,255,255,0.25)";
        ctx.lineWidth = isPinching ? 2 : 1;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(f.x, f.y, isPinching ? 6 : 3, 0, Math.PI * 2);
        ctx.fillStyle = isPinching
          ? "rgba(245,220,255,0.95)"
          : "rgba(255,255,255,0.45)";
        ctx.fill();
      }
    }

    function cleanupRipples() {
      const now = performance.now();

      for (let i = ripples.length - 1; i >= 0; i--) {
        if ((now - ripples[i].t) / 1000 > RIPPLE_LIFETIME + 0.1) {
          ripples.splice(i, 1);
        }
      }
    }

    function animate() {
      drawWaterBase();
      updateFallingDrops();
      drawInterferenceField();
      detectInterferenceSound();
      drawRipples();
      drawFallingDrops();
      drawInterferenceSoundMarks();
      drawFingerTouches();
      cleanupRipples();

      requestAnimationFrame(animate);
    }

    animate();


    function getDistance2D(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function getDistance3D(a, b) {
      const dz = (a.z || 0) - (b.z || 0);
      return Math.hypot(a.x - b.x, a.y - b.y, dz);
    }

    function getHandScale(landmarks) {
      // MediaPipe Handsの21点ランドマークを使う。
      // 角度による見かけの変化を減らすため、複数の距離を平均して手のサイズを推定する。
      const wrist = landmarks[0];
      const indexMcp = landmarks[5];
      const middleMcp = landmarks[9];
      const ringMcp = landmarks[13];
      const pinkyMcp = landmarks[17];

      const palmLength = getDistance3D(wrist, middleMcp);
      const palmWidthA = getDistance3D(indexMcp, pinkyMcp);
      const palmWidthB = getDistance3D(indexMcp, ringMcp) + getDistance3D(ringMcp, pinkyMcp);

      return Math.max(0.001, palmLength * 0.85 + palmWidthA * 0.65 + palmWidthB * 0.25);
    }

    function getPinchInfo(landmarks) {
      const thumbTip = landmarks[4];
      const thumbIp = landmarks[3];
      const thumbMcp = landmarks[2];

      const indexTip = landmarks[8];
      const indexDip = landmarks[7];
      const indexPip = landmarks[6];
      const indexMcp = landmarks[5];

      const handScale = getHandScale(landmarks);

      // 2Dだけだと手の向きで距離が変わりやすいため、MediaPipeのzも含めた3D距離を併用する。
      const tip2D = getDistance2D(thumbTip, indexTip) / handScale;
      const tip3D = getDistance3D(thumbTip, indexTip) / handScale;

      // ピンチは必ずしも「先端同士」だけが最短にならない。
      // 指の角度によって親指先端が人差し指DIP/PIP側に近づくことがあるため、複数点の最小距離を見る。
      const candidates = [
        getDistance3D(thumbTip, indexTip),
        getDistance3D(thumbTip, indexDip),
        getDistance3D(thumbTip, indexPip),
        getDistance3D(thumbIp, indexTip),
        getDistance3D(thumbIp, indexDip)
      ].map(v => v / handScale);

      const multiPointDistance = Math.min(...candidates);

      // 指の腹同士が近づいているかを見る補助指標
      const padDistance =
        (
          getDistance3D(thumbTip, indexTip) +
          getDistance3D(thumbIp, indexDip) +
          getDistance3D(thumbMcp, indexMcp) * 0.2
        ) / handScale;

      // 人差し指が完全に伸びているだけの状態をピンチと誤認しにくくする
      const indexBend =
        getDistance3D(indexTip, indexMcp) /
        Math.max(0.001, getDistance3D(indexPip, indexMcp) + getDistance3D(indexDip, indexPip));

      // 角度依存を下げるため、最終スコアは「先端距離」より「複数点の最小距離」を強めに使う。
      const score =
        multiPointDistance * 0.58 +
        tip3D * 0.24 +
        tip2D * 0.12 +
        padDistance * 0.06;

      return {
        score,
        tip2D,
        tip3D,
        multiPointDistance,
        padDistance,
        indexBend
      };
    }

    function onHandsResults(results) {
      const now = performance.now();

      if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
        setPinchGauge(0, false);
        return;
      }

      let strongestPinch = null;

      results.multiHandLandmarks.forEach((landmarks, handIndex) => {
        const thumbTip = landmarks[4];  // 親指先端
        const indexTip = landmarks[8];  // 人差し指先端

        // 自撮り感覚に合わせて左右反転
        const x = (1 - indexTip.x) * W;
        const y = indexTip.y * H;

        const key = "hand_" + handIndex;
        const prev = fingerState.get(key);

        const pinch = getPinchInfo(landmarks);

        // ピンチ開始と解除のしきい値。
        // v7では3D距離＋複数ランドマークの近接スコアを使うため、
        // 手の角度が変わっても反応が途切れにくい。
        const PINCH_ON = 0.255;
        const PINCH_OFF = 0.345;

        const looksLikePinch =
          pinch.score < PINCH_ON &&
          pinch.multiPointDistance < 0.31 &&
          pinch.tip3D < 0.42;

        if (prev) {
          // 数フレーム安定してからピンチ成立にする
          if (looksLikePinch) {
            prev.pinchFrames = Math.min(8, prev.pinchFrames + 1);
            prev.releaseFrames = 0;
          } else if (pinch.score > PINCH_OFF) {
            prev.releaseFrames = Math.min(8, prev.releaseFrames + 1);
            prev.pinchFrames = 0;
          } else {
            // 中間領域では前回状態を維持
            prev.pinchFrames = Math.max(0, prev.pinchFrames - 0.25);
            prev.releaseFrames = Math.max(0, prev.releaseFrames - 0.25);
          }

          const wasPinching = prev.wasPinching;
          let isPinching = wasPinching;

          if (!wasPinching && prev.pinchFrames >= 2) {
            isPinching = true;
          }

          if (wasPinching && prev.releaseFrames >= 3) {
            isPinching = false;
          }

          // ピンチした瞬間だけ、強い水滴を落とす
          if (isPinching && !wasPinching) {
            addFallingDrop(x, y, 3.2);
            prev.lastRipple = now;
          }

          prev.x = x;
          prev.y = y;
          prev.lastSeen = now;
          prev.wasPinching = isPinching;
          prev.pinchInfo = pinch;

          const pinchStrength = 1 - Math.min(1, pinch.score / PINCH_OFF);
          if (!strongestPinch || pinchStrength > strongestPinch.strength) {
            strongestPinch = {
              strength: pinchStrength,
              active: isPinching,
              score: pinch.score
            };
          }
        } else {
          fingerState.set(key, {
            x,
            y,
            lastSeen: now,
            lastRipple: 0,
            wasPinching: false,
            pinchFrames: 0,
            releaseFrames: 0,
            pinchInfo: pinch
          });
        }
      });

      if (strongestPinch) {
        setPinchGauge(strongestPinch.strength, strongestPinch.active);
      }
    }

    async function startApp() {
      if (started) return;
      started = true;

      initAudio();

      try {
        const hands = new Hands({
          locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
          }
        });

        hands.setOptions({
          maxNumHands: 2,
          modelComplexity: 1,
          minDetectionConfidence: 0.65,
          minTrackingConfidence: 0.55
        });

        hands.onResults(onHandsResults);

        const camera = new Camera(video, {
          onFrame: async () => {
            await hands.send({ image: video });
          },
          width: 640,
          height: 480
        });

        await camera.start();

        startBtn.textContent = "Camera / Audio Started";
        startBtn.disabled = true;
        statusEl.textContent = "camera: running";
        statusLedEl.classList.remove("warn");
        statusLedEl.classList.add("on");
      } catch (err) {
        console.error(err);
        statusEl.textContent = "camera: error / HTTPS or localhost required";
        startBtn.textContent = "Retry Camera / Audio";
        startBtn.disabled = false;
        started = false;
        statusLedEl.classList.remove("on");
        statusLedEl.classList.add("warn");
      }
    }

    startBtn.addEventListener("click", startApp);
  </script>
</body>
</html>
